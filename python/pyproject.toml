[project]
name = "apiverve-markdowntoimage"
version = "1.2.2"
authors = [
  { name="APIVerve", email="hello@apiverve.com" },
]
description = "Markdown to Image converts markdown text into visual image representations, rendering content as PNG, JPEG, or WebP images."
keywords = ["markdown to image", "image converter", "markdown renderer", "visual content", "markdown graphics"]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "requests>=2.25.0"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Natural Language :: English",
]

[project.urls]
Homepage = "https://apiverve.com/marketplace/markdowntoimage?utm_source=pypi&utm_medium=referral&utm_content=homepage"
Documentation = "https://docs.apiverve.com/ref/markdowntoimage?utm_source=pypi&utm_medium=referral&utm_content=docs"
Repository = "https://github.com/apiverve/markdowntoimage-api"
Twitter = "https://twitter.com/apivervehq"
